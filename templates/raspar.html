<!doctype html>
<html lang="{{ lang }}">
<head>
  <title>{{ _('Mapa de raspar') }} · Scratch Map</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/maplibre-gl.css') }}">
{% include '_head.html' %}
  <style>
    /* Preview do mapa de raspar tradicional (pôster): película metálica sobre
       o mundo; o que foi visitado aparece raspado, cada país com sua cor. */
    :root { --ocean: #14213d; --ink: #e9d8a6; --muted: #b9a774; --grid: rgba(233, 216, 166, .16); }
    body.prata { --ocean: #efe6d2; --ink: #3b3a36; --muted: #7d776a; --grid: rgba(59, 58, 54, .14); }
    html, body { margin: 0; height: 100%; background: var(--ocean); color: var(--ink); }
    #map { position: fixed; inset: 0; background: var(--ocean); }
    .poster-title, .poster-foot { background: linear-gradient(var(--ocean) 55%, transparent); }
    .poster-foot { background: linear-gradient(transparent, var(--ocean) 45%); }
    .poster-title {
      position: fixed; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 26px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none;
    }
    .poster-title h1 {
      margin: 0; font: 600 22px/1.1 Georgia, "Times New Roman", serif; letter-spacing: .14em; text-transform: uppercase;
    }
    .poster-title small { display: block; margin-top: 4px; font: 13px/1.3 system-ui, sans-serif; letter-spacing: .06em; color: var(--muted); }
    .controls { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
    .seg { display: flex; border: 1px solid var(--muted); border-radius: 999px; overflow: hidden; }
    .seg button {
      border: none; background: none; color: var(--muted); padding: 5px 11px; font: 600 12.5px system-ui, sans-serif; cursor: pointer;
    }
    .seg button[aria-pressed="true"] { background: var(--ink); color: var(--ocean); }
    .poster-foot {
      position: fixed; left: 0; right: 0; bottom: 0; padding: 26px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
      display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none;
      font: 13px/1.3 system-ui, sans-serif; color: var(--muted); letter-spacing: .04em;
    }
    .poster-foot b { display: block; font: 600 30px/1 Georgia, serif; color: var(--ink); }
    .poster-foot a { pointer-events: auto; color: inherit; }
    #tip {
      position: fixed; padding: 4px 9px; border-radius: 6px; background: rgba(0, 0, 0, .75); color: #fff;
      font: 13px system-ui, sans-serif; pointer-events: none; transform: translate(-50%, -130%);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <header class="poster-title">
    <div><h1>{{ _('Mapa de raspar') }}</h1><small>{{ prefs.name or 'Scratch Map' }}</small></div>
    <div class="controls">
      <div class="seg" id="style"><button data-v="ouro">{{ _('Ouro') }}</button><button data-v="prata">{{ _('Prata') }}</button></div>
      <div class="seg" id="level"><button data-v="paises">{{ _('Países') }}</button><button data-v="estados">{{ _('Estados') }}</button></div>
    </div>
  </header>
  <footer class="poster-foot">
    <div><b id="n">0</b><span id="pct"></span></div>
    <a href="/">{{ _('Voltar ao mapa') }}</a>
  </footer>
  <div id="tip" hidden></div>

  <script>window.GEO_V = {{ geo_v }};</script>
  <script src="{{ url_for('static', filename='vendor/maplibre-gl.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/pmtiles.js') }}"></script>
  <script src="{{ url_for('static', filename='common.js') }}"></script>
  <script>
  (async () => {
    const { api, t } = window.SM;
    const q = new URLSearchParams(location.search);
    let style = q.get('estilo') === 'prata' ? 'prata' : 'ouro';
    let level = q.get('nivel') === 'estados' ? 'estados' : 'paises';

    // película: metal escovado com brilho na diagonal e grão (canvas → padrão do MapLibre)
    // Sem emenda: tudo periódico no tamanho do padrão (o MapLibre repete por tile).
    const FOIL = {
      ouro: { dark: [150, 112, 32], light: [246, 222, 130], line: '#7a5c14' },
      prata: { dark: [138, 142, 148], light: [242, 243, 245], line: '#7c8086' },
    };
    function foil(name) {
      const s = 256, { dark, light } = FOIL[name];
      const data = new Uint8ClampedArray(s * s * 4);
      const streak = Array.from({ length: s }, () => (Math.random() - 0.5) * 18);  // riscos do metal escovado
      for (let y = 0; y < s; y++) {
        for (let x = 0; x < s; x++) {
          const k = 2 * Math.PI / s;
          const v = 0.55 + 0.22 * Math.sin(k * (x + y)) + 0.06 * Math.sin(k * (2 * x - y) + 1.3);
          const n = streak[y] + (Math.random() - 0.5) * 22;
          const i = (y * s + x) * 4;
          for (let c = 0; c < 3; c++) data[i + c] = dark[c] + (light[c] - dark[c]) * v + n;
          data[i + 3] = 255;
        }
      }
      return { width: s, height: s, data };
    }

    // cor de cada lugar raspado: fixa por id (o mesmo país sempre com a mesma cor)
    const PALETTE = ['#e4572e', '#f3a712', '#5b8e7d', '#669bbc', '#a8c686', '#db2763', '#17bebb', '#9b5de5', '#ef8354', '#4f9d69', '#f15bb5', '#00a6fb'];
    const colorOf = (id) => PALETTE[[...String(id)].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7) % PALETTE.length];

    const graticule = { type: 'FeatureCollection', features: [] };
    for (let lon = -180; lon <= 180; lon += 30) graticule.features.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: [[lon, -85], [lon, 85]] } });
    for (let lat = -60; lat <= 60; lat += 30) graticule.features.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: [[-180, lat], [180, lat]] } });

    const [visited, stats] = await Promise.all([api('/api/visited'), api('/api/stats')]);
    const ids = (k) => visited[k].map((p) => String(p.id));
    const FID = ['coalesce', ['get', 'id'], ['get', 'oid']];
    const colorExpr = (list) => (list.length
      ? ['match', FID, ...list.flatMap((id) => [id, colorOf(id)]), 'rgba(0,0,0,0)'] : 'rgba(0,0,0,0)');

    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol('pmtiles', protocol.tile);
    const map = new maplibregl.Map({
      container: 'map',
      style: { version: 8, sources: {}, layers: [{ id: 'ocean', type: 'background', paint: { 'background-color': getComputedStyle(document.body).getPropertyValue('--ocean') } }] },
      bounds: [[-168, -56], [190, 78]], fitBoundsOptions: { padding: { top: 100, bottom: 80, left: 8, right: 8 } },
      minZoom: -1, maxZoom: 8,  // celular em pé: o mundo inteiro cabe renderWorldCopies: false, attributionControl: false, dragRotate: false, pitchWithRotate: false,
    });
    map.touchZoomRotate.disableRotation();

    function paint() {
      document.body.className = style;
      const ocean = getComputedStyle(document.body).getPropertyValue('--ocean').trim();
      map.setPaintProperty('ocean', 'background-color', ocean);
      if (map.hasImage('foil')) map.removeImage('foil');
      map.addImage('foil', foil(style));
      map.setPaintProperty('foil', 'fill-pattern', 'foil');
      map.setPaintProperty('foil-lines', 'line-color', FOIL[style].line);
      map.setPaintProperty('grid', 'line-color', getComputedStyle(document.body).getPropertyValue('--grid').trim());
      const states = level === 'estados';
      map.setPaintProperty('scratched-country', 'fill-color', colorExpr(states ? ids('country').filter((id) => !hasStates.has(id)) : ids('country')));
      map.setPaintProperty('scratched-state', 'fill-color', colorExpr(states ? ids('state') : []));
      map.setLayoutProperty('state-lines', 'visibility', states ? 'visible' : 'none');
      for (const [box, v] of [['style', style], ['level', level]]) {
        document.querySelectorAll(`#${box} button`).forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === v));
      }
      const n = states ? ids('state').length : ids('country').length;
      document.getElementById('n').textContent = n;
      document.getElementById('pct').textContent = states
        ? t(n === 1 ? 'estado raspado' : 'estados raspados')
        : `${t(n === 1 ? 'país raspado' : 'países raspados')} · ${Math.round((100 * ids('country').length) / stats.countries_total)}% ${t('do mundo')}`;
      const u = new URL(location.href);
      u.searchParams.set('estilo', style);
      u.searchParams.set('nivel', level);
      history.replaceState(null, '', u);
    }
    // no nível "estados", país com estado visitado mostra só os estados raspados
    const hasStates = new Set(visited.state.map((s) => s.country_id).filter(Boolean));

    map.on('load', () => {
      const ADMIN = (layer) => ({ source: 'admin', 'source-layer': layer });
      map.addSource('admin', { type: 'vector', url: `pmtiles://${location.origin}/geo/world.pmtiles?v=${window.GEO_V}` });
      map.addSource('grid', { type: 'geojson', data: graticule });
      map.addLayer({ id: 'grid', type: 'line', source: 'grid', paint: { 'line-width': 0.6 } });
      map.addImage('foil', foil(style));
      // a Antártida fica de fora, como nos pôsteres (e não toma meia tela no celular)
      map.addLayer({ id: 'foil', type: 'fill', ...ADMIN('countries'), filter: ['!=', FID, 'AQ'], paint: { 'fill-pattern': 'foil' } });
      map.addLayer({ id: 'scratched-country', type: 'fill', ...ADMIN('countries'), paint: { 'fill-color': 'rgba(0,0,0,0)' } });
      map.addLayer({ id: 'scratched-state', type: 'fill', ...ADMIN('states'), paint: { 'fill-color': 'rgba(0,0,0,0)' } });
      map.addLayer({ id: 'state-lines', type: 'line', ...ADMIN('states'), paint: { 'line-color': 'rgba(255,255,255,.55)', 'line-width': 0.5 } });
      map.addLayer({ id: 'foil-lines', type: 'line', ...ADMIN('countries'), filter: ['!=', FID, 'AQ'], paint: { 'line-width': ['interpolate', ['linear'], ['zoom'], 0, 0.4, 5, 1.2] } });
      paint();
    });

    document.getElementById('style').onclick = (e) => { if (e.target.dataset.v) { style = e.target.dataset.v; paint(); } };
    document.getElementById('level').onclick = (e) => { if (e.target.dataset.v) { level = e.target.dataset.v; paint(); } };

    // nome ao tocar (como no pôster, sem gaveta)
    const tip = document.getElementById('tip');
    const NAMES = await api('/api/names').catch(() => ({ country: {}, state: {} }));
    map.on('click', (e) => {
      const layer = level === 'estados' ? 'scratched-state' : 'scratched-country';
      const [f] = map.queryRenderedFeatures(e.point, { layers: [layer, 'foil'] });
      if (!f) { tip.hidden = true; return; }
      const id = String(f.properties.id ?? f.properties.oid);
      const kind = f.layer.id === 'scratched-state' ? 'state' : 'country';
      tip.textContent = NAMES[kind]?.[id] || f.properties.name || id;
      Object.assign(tip.style, { left: `${e.point.x}px`, top: `${e.point.y}px` });
      tip.hidden = false;
    });
  })();
  </script>
</body>
</html>
