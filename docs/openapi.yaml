openapi: 3.1.0
info:
  title: Scratch Map API
  version: "0.1"
  summary: A self-hosted digital scratch map — a API que a própria interface usa.
  description: |
    API HTTP do scratch map, servida pelo próprio app (mesma porta da
    interface). É a API que as telas usam; esta especificação descreve o
    comportamento atual, como base para integrações (Home Assistant, Immich,
    scripts).

    ## Perfis
    Cada pessoa da casa tem um perfil, com dados próprios. Toda chamada vale
    para **um perfil**, escolhido pelo cookie `perfil=<id>` (o mesmo que a tela
    "Quem está usando?" grava). Com um perfil só, ele é usado sem cookie. Com
    vários e sem cookie, as rotas de `/api/` respondem **409**.

    Para escolher um perfil fora do navegador, mande o cookie:
    `curl -b perfil=2 http://servidor:5020/api/visited`.

    ## Autenticação
    **Nenhuma.** O app confia em quem alcança a porta (rede de casa ou VPN,
    como o Tailscale). Não exponha a porta na internet.

    ## Convenções
    - `kind`: `country | state | city | airport` são marcáveis (visitas);
      `landmark` (monumento) tem fotos, busca e detalhe, mas não é marcado.
    - Ids: país = ISO 3166-1 alfa-2 (`BR`); estado = ISO 3166-2 (`BR-SP`) ou o
      id do Overture quando não há código; cidade = id do GeoNames (número,
      mandado como texto); aeroporto = código IATA (`GRU`); monumento = número.
    - `visited` = conta como visitado (marcado direto ou implícito: uma cidade
      marca o estado e o país; um estado marca o país). `explicit` = foi
      marcado diretamente.
    - Nomes: países no idioma do perfil (`language`); estados e cidades com o
      nome de lá.
    - Respostas JSON maiores que 2 KB vêm com gzip quando o cliente aceita.
    - Erros: código HTTP com uma página HTML curta (`<p>mensagem</p>`); a
      mensagem está traduzida no idioma do perfil.

    ## Estabilidade
    Ainda não há versão estável (`/api/v1`): as rotas podem mudar junto com a
    interface. As que uma integração deve preferir estão marcadas com a tag
    **integração**.
  license:
    name: MIT
    url: https://github.com/giulianosrebuli/scratch-map/blob/main/LICENSE
externalDocs:
  description: README do projeto
  url: https://github.com/giulianosrebuli/scratch-map#readme
servers:
  - url: /
    description: o próprio servidor do app
security:
  - perfil: []
tags:
  - name: integração
    description: As mais úteis para integrações (consultar e marcar visitas, fotos).
  - name: visitas
  - name: lugares
  - name: fotos
  - name: monumentos
  - name: álbum
  - name: perfil
  - name: backup
  - name: instalação

paths:
  /api/visited:
    get:
      tags: [visitas, integração]
      summary: Tudo o que foi visitado, por tipo
      description: |
        Visitados explícitos e implícitos, com a contagem de fotos de cada um
        (na cidade, inclui as dos monumentos e aeroportos dela). Monumentos
        rascunho ficam de fora.
      responses:
        "200":
          description: Um objeto por tipo.
          content:
            application/json:
              schema:
                type: object
                required: [country, state, city, airport, landmark]
                properties:
                  country:
                    type: array
                    items: {$ref: "#/components/schemas/VisitedCountry"}
                  state:
                    type: array
                    items: {$ref: "#/components/schemas/VisitedState"}
                  city:
                    type: array
                    items: {$ref: "#/components/schemas/VisitedCity"}
                  airport:
                    type: array
                    items: {$ref: "#/components/schemas/VisitedAirport"}
                  landmark:
                    type: array
                    items: {$ref: "#/components/schemas/VisitedLandmark"}
        "409": {$ref: "#/components/responses/NoProfile"}

  /api/visits:
    post:
      tags: [visitas, integração]
      summary: Marca um lugar
      description: |
        Marca país, estado, cidade ou aeroporto. Numa cidade, calcula o
        contorno na hora (1–3 s na primeira vez; no modo Leve, pede ao
        Nominatim se ligado). Também dispara, em segundo plano, a busca das
        bandeiras de estado do país.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, id]
              properties:
                kind: {$ref: "#/components/schemas/VisitKind"}
                id:
                  type: string
                  description: Id do lugar (cidade pode ir como número).
            example: {kind: city, id: "3451190"}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}

  /api/visits/{kind}/{id}:
    delete:
      tags: [visitas, integração]
      summary: Desmarca um lugar
      description: As fotos do lugar vão para a lixeira do perfil (`photos/trash/`), recuperáveis à mão.
      parameters:
        - {name: kind, in: path, required: true, schema: {$ref: "#/components/schemas/VisitKind"}}
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /api/visits/batch:
    post:
      tags: [visitas, integração]
      summary: Marca várias cidades de uma vez
      description: |
        Até 2000 ids do GeoNames; os desconhecidos são ignorados. Os contornos
        vêm em segundo plano (veja `pending` em `/api/city-shapes`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 2000
                  items: {type: [string, integer]}
            example: {ids: ["3451190", "3448439"]}
      responses:
        "200":
          description: Quantas foram marcadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  added: {type: integer}

  /api/search:
    get:
      tags: [lugares, integração]
      summary: Busca por nome
      description: |
        Sem acento e sem diferenciar maiúsculas; prefixo antes de trecho.
        Pelo menos 2 letras (menos que isso: lista vazia). Até 15 resultados
        com um tipo, 5 por tipo com vários. Código IATA exato vem primeiro.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2}, example: ouro preto}
        - name: kind
          in: query
          description: Tipos, separados por vírgula (padrão, todos).
          schema: {type: string, default: "country,state,city,airport,landmark"}
          example: city,airport
      responses:
        "200":
          description: Resultados.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SearchResult"}

  /api/nearby:
    get:
      tags: [lugares, integração]
      summary: Cidades ou aeroportos perto de um ponto
      description: Os mais próximos dentro de um quadrado de `r` graus; cidades grandes ganham um empurrão.
      parameters:
        - {name: lat, in: query, required: true, schema: {type: number}}
        - {name: lon, in: query, required: true, schema: {type: number}}
        - {name: kind, in: query, schema: {type: string, enum: [city, airport], default: city}}
        - {name: r, in: query, description: Raio em graus., schema: {type: number, default: 1.0}}
        - {name: limit, in: query, schema: {type: integer, default: 10, maximum: 30}}
      responses:
        "200":
          description: Do mais próximo ao mais longe.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SearchResult"}

  /api/landmarks/near:
    get:
      tags: [lugares, monumentos, integração]
      summary: Cidade, estado e país de um ponto
      description: |
        A cidade que contém o ponto (pelo contorno de uma cidade já marcada) ou
        a mais próxima, com a distância em km, e o estado e o país dela, com o
        status de visitado. Útil para "onde esta foto foi tirada?".
      parameters:
        - {name: lat, in: query, required: true, schema: {type: number}}
        - {name: lon, in: query, required: true, schema: {type: number}}
      responses:
        "200":
          description: Cidade, estado e país (vazia se não houver cidade num raio de ~1°).
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - {$ref: "#/components/schemas/PlaceRef"}
                    - $ref: "#/components/schemas/VisitFlags"
                    - type: object
                      properties:
                        km: {type: number, description: Só na cidade.}

  /api/place/{kind}/{id}:
    get:
      tags: [lugares, integração]
      summary: Detalhe de um lugar
      description: |
        Dados do lugar, a hierarquia (`crumbs`), se está visitado e por quê
        (`via`: as visitas que o tornam visitado) e as fotos. Cidade: as fotos
        dela e as dos monumentos e aeroportos dela. Estado/país: as dele em
        `photos` e as de dentro em `groups` (uma por cidade).
      parameters:
        - {name: kind, in: path, required: true, schema: {$ref: "#/components/schemas/Kind"}}
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: O lugar.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Place"}
        "404": {$ref: "#/components/responses/Error"}

  /api/place/{kind}/{id}/dates:
    post:
      tags: [visitas, integração]
      summary: Acrescenta uma data de visita
      description: |
        Ano (e, se quiser, mês) de uma visita ao lugar, ou um período (pode ter várias). País, estado,
        cidade ou aeroporto sem visita também ficam **marcados**. Repetir a
        mesma data não faz nada.
      parameters:
        - {name: kind, in: path, required: true, schema: {$ref: "#/components/schemas/Kind"}}
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month]
              properties:
                month: {$ref: "#/components/schemas/Month"}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}

  /api/place/{kind}/{id}/dates/{month}:
    delete:
      tags: [visitas]
      summary: Remove uma data de visita
      description: O lugar continua marcado.
      parameters:
        - {name: kind, in: path, required: true, schema: {$ref: "#/components/schemas/Kind"}}
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: month, in: path, required: true, schema: {$ref: "#/components/schemas/Month"}}
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /api/years:
    get:
      tags: [álbum, visitas]
      summary: Visitas por ano
      description: |
        Um item por ano com data de visita, do mais recente ao mais antigo.
        Um período entra em todos os anos dele.
        `counts` conta os lugares de cada tipo, com estado e país contando
        pelo que tem data dentro deles; `months` lista, por mês, os lugares
        que têm a data.
      responses:
        "200":
          description: Os anos.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    year: {type: string, example: "2024"}
                    counts:
                      type: object
                      additionalProperties: {type: integer}
                    months:
                      type: array
                      items:
                        type: object
                        properties:
                          month: {$ref: "#/components/schemas/Month"}
                          places:
                            type: array
                            items:
                              allOf:
                                - {$ref: "#/components/schemas/PlaceRef"}
                                - type: object
                                  properties:
                                    country: {type: [string, "null"], description: Nome do país (menos para país).}

  /api/place/{kind}/{id}/photos:
    post:
      tags: [fotos, integração]
      summary: Envia fotos para um lugar
      description: |
        Grava o original e gera a versão de exibição (2000 px) e a miniatura
        (600 px). A data vem do EXIF; sem EXIF, de `date`. Foto num país,
        estado, cidade ou aeroporto também **marca** o lugar (monumento não
        marca nada). HEIC do iPhone é aceito.
      parameters:
        - {name: kind, in: path, required: true, schema: {$ref: "#/components/schemas/Kind"}}
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  items: {type: string, format: binary}
                date:
                  type: string
                  format: date
                  description: Data para as fotos sem EXIF.
      responses:
        "200":
          description: Ids das fotos gravadas e os erros das que falharam.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SaveResult"}
        "400":
          description: Nenhuma foto gravada (todas falharam) ou tipo inválido.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SaveResult"}

  /api/photos:
    get:
      tags: [fotos, integração]
      summary: Todas as fotos (mural)
      responses:
        "200":
          description: Mais recentes primeiro (sem data no fim), e agrupadas por localidade.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recent:
                    type: array
                    items: {$ref: "#/components/schemas/IndexedPhoto"}
                  groups:
                    type: array
                    items: {$ref: "#/components/schemas/PhotoGroup"}

  /api/photos/{id}:
    patch:
      tags: [fotos]
      summary: Muda a data de uma foto
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taken_on: {type: [string, "null"], format: date, description: "null tira a data."}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
    delete:
      tags: [fotos]
      summary: Apaga uma foto
      description: Vai para a lixeira. A última foto de um monumento apaga o monumento.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Apagada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  place_deleted: {type: boolean, description: O monumento foi junto.}
        "404": {$ref: "#/components/responses/Error"}

  /photos/{size}/{file}:
    get:
      tags: [fotos]
      summary: Arquivo de uma foto
      description: Os caminhos vêm prontos em `url` e `thumb` das fotos. Cache de um ano (o nome muda se a foto mudar).
      parameters:
        - {name: size, in: path, required: true, schema: {type: string, enum: [display, thumb, orig]}}
        - {name: file, in: path, required: true, schema: {type: string}, example: bd904d40af254481af7a30e3bb6874ce.jpg}
      responses:
        "200":
          description: A imagem.
          content:
            image/jpeg: {}
        "404": {description: Não existe.}

  /api/landmarks:
    post:
      tags: [monumentos]
      summary: Cria um monumento (rascunho) a partir de fotos
      description: |
        O monumento nasce como rascunho; se alguma foto tiver GPS, já recebe a
        posição e a cidade mais próxima. Sai do rascunho com
        `PATCH /api/landmarks/{id}` (nome e posição). Rascunho abandonado por
        mais de um dia é apagado na subida.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  items: {type: string, format: binary}
      responses:
        "200":
          description: Criado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  gps:
                    type: [array, "null"]
                    items: {type: number}
                    description: "[lat, lon] da primeira foto com GPS."
                  errors: {type: array, items: {type: string}}
        "400":
          description: Nenhuma foto válida.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SaveResult"}

  /api/landmarks/{id}:
    patch:
      tags: [monumentos]
      summary: Nome e posição de um monumento
      description: Com `name`, sai do rascunho (precisa ter posição, já gravada ou neste mesmo pedido).
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 200}
                lat: {type: number}
                lon: {type: number}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [monumentos]
      summary: Apaga um monumento
      description: As fotos vão para a lixeira.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200": {$ref: "#/components/responses/Ok"}

  /api/landmarks/suggest:
    get:
      tags: [monumentos]
      summary: Sugestão de nome para um ponto
      description: |
        Pergunta ao Nominatim (OpenStreetMap) o ponto de interesse mais
        próximo; só as coordenadas saem da máquina. Desligado nas
        Configurações (`ext_landmark_name`): `name` vem `null` sem pedido.
      parameters:
        - {name: lat, in: query, required: true, schema: {type: number}}
        - {name: lon, in: query, required: true, schema: {type: number}}
      responses:
        "200":
          description: Sugestão.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: [string, "null"]}

  /api/city-shapes:
    get:
      tags: [lugares]
      summary: Contornos das cidades visitadas (GeoJSON)
      description: |
        Os já calculados. Com `ids`, só essas. `pending: true` = ainda há
        contornos sendo calculados em segundo plano; peça de novo depois.
        Sem `ids`, pode passar de 1 MB comprimido.
      parameters:
        - {name: ids, in: query, description: Ids de cidade separados por vírgula., schema: {type: string}}
      responses:
        "200":
          description: FeatureCollection; cada feição com `properties.id` e `properties.name`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: {const: FeatureCollection}
                  pending: {type: boolean}
                  features: {type: array, items: {type: object}}

  /api/names:
    get:
      tags: [lugares]
      summary: Nome de cada país e estado
      description: Mapa id → nome (países no idioma do perfil). Usado no hover do mapa.
      responses:
        "200":
          description: Nomes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  country: {type: object, additionalProperties: {type: string}}
                  state: {type: object, additionalProperties: {type: string}}

  /api/countries:
    get:
      tags: [lugares]
      summary: Lista de países
      description: Por nome, sem os territórios disputados sem bandeira; `home` = o país com mais cidades marcadas.
      responses:
        "200":
          description: Países.
          content:
            application/json:
              schema:
                type: object
                properties:
                  countries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string}
                  home: {type: [string, "null"]}

  /api/cities:
    get:
      tags: [lugares]
      summary: Cidades de um país ou estado, maiores primeiro
      description: 50 por página. Na primeira página sem `state`, vêm também os estados do país.
      parameters:
        - {name: country, in: query, required: true, schema: {type: string}, example: BR}
        - {name: state, in: query, schema: {type: string}, example: BR-MG}
        - {name: q, in: query, description: Filtro por nome., schema: {type: string}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        "200":
          description: Uma página.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cities:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string}
                        state: {type: string}
                        visited: {type: boolean}
                  more: {type: boolean, description: Há mais páginas.}
                  states:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string}

  /api/stats:
    get:
      tags: [álbum, integração]
      summary: Totais e o álbum de países
      description: |
        `totals`: quantos lugares de cada tipo contam como visitados (bom para
        um sensor). `countries`: os países com bandeira, visitados primeiro.
      responses:
        "200":
          description: Totais e países.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals:
                    type: object
                    properties:
                      country: {type: integer}
                      state: {type: integer}
                      city: {type: integer}
                      airport: {type: integer}
                      landmark: {type: integer}
                  countries_total: {type: integer}
                  countries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string}
                        visited: {type: boolean}
              example:
                totals: {country: 2, state: 9, city: 53, airport: 8, landmark: 9}
                countries_total: 250
                countries: [{id: BR, name: Brasil, visited: true}]

  /api/stats/country/{id}:
    get:
      tags: [álbum]
      summary: Estados de um país
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, example: BR}
      responses:
        "200":
          description: O país e seus estados, com a bandeira e quantas cidades visitadas em cada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  country: {$ref: "#/components/schemas/FlagPlace"}
                  states:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/FlagPlace"
                        - type: object
                          properties:
                            cities: {type: integer}
        "404": {$ref: "#/components/responses/Error"}

  /api/stats/state/{id}:
    get:
      tags: [álbum]
      summary: Cidades de um estado
      description: Visitadas primeiro (por nome), depois as maiores.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, example: BR-MG}
      responses:
        "200":
          description: O estado e suas cidades.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: {$ref: "#/components/schemas/FlagPlace"}
                  country: {$ref: "#/components/schemas/PlaceRef"}
                  cities:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string}
                        visited: {type: boolean}
                        photos: {type: integer}
                        population: {type: integer}
        "404": {$ref: "#/components/responses/Error"}

  /api/flags/refetch:
    post:
      tags: [álbum]
      summary: Busca de novo as bandeiras de estado
      description: Em segundo plano, no Wikidata/Commons. 409 se desligado nas Configurações.
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "409": {$ref: "#/components/responses/Error"}

  /api/settings:
    patch:
      tags: [perfil]
      summary: Muda configurações do perfil
      description: |
        Só as chaves enviadas mudam; `null` volta ao padrão. Chave ou valor
        inválido: 400. Devolve as preferências atuais.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                theme: {type: [string, "null"], enum: [light, dark, auto, null]}
                language: {type: [string, "null"], enum: [pt-BR, en, null]}
                projection: {type: [string, "null"], enum: [mercator, globe, null]}
                profile_name: {type: [string, "null"], maxLength: 80}
                start_view: {type: [string, "null"], enum: [country, all, last, fixed, null]}
                home_country: {type: [string, "null"], description: Id de país.}
                start_fixed: {type: [string, "null"], description: '"lon,lat,zoom"', example: "-45,-15,4"}
                skip_animations: {type: boolean}
                borders_country: {type: boolean}
                borders_state: {type: boolean}
                borders_city: {type: boolean}
                ext_landmark_name: {type: boolean}
                ext_city_shape: {type: boolean}
                ext_state_flags: {type: boolean}
              patternProperties:
                "^color_(water|land|country|state|city|airport|landmark)$":
                  type: [string, "null"]
                  pattern: "^#[0-9a-fA-F]{6}$"
            example: {theme: dark, skip_animations: true}
      responses:
        "200":
          description: Preferências atuais.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Prefs"}
        "400": {$ref: "#/components/responses/Error"}

  /api/profile/photo:
    post:
      tags: [perfil]
      summary: Foto de perfil
      description: Recorte quadrado do centro, 512 px.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: {type: string, format: binary}
      responses:
        "200":
          description: Preferências atuais.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Prefs"}
        "400": {$ref: "#/components/responses/Error"}
    delete:
      tags: [perfil]
      summary: Tira a foto de perfil
      responses:
        "200":
          description: Preferências atuais.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Prefs"}

  /profile.jpg:
    get:
      tags: [perfil]
      summary: Foto do perfil em uso
      responses:
        "200": {description: A foto., content: {image/jpeg: {}}}
        "404": {description: Sem foto.}

  /api/profile:
    delete:
      tags: [perfil]
      summary: Apaga o perfil em uso
      description: A pasta vai para `data/profiles-removed/`. O único perfil não pode ser apagado (409). Limpa o cookie.
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "409": {$ref: "#/components/responses/Error"}

  /api/profile/export:
    get:
      tags: [perfil, backup]
      summary: Exporta o perfil em uso (.zip)
      description: Visitas, monumentos, configurações, fotos e bandeiras de um perfil, para importar em outra instalação.
      responses:
        "200": {description: O arquivo., content: {application/zip: {}}}

  /api/profile/import:
    post:
      tags: [perfil, backup]
      summary: Preenche um perfil novo com um perfil exportado
      description: Só num perfil recém-criado (ainda no assistente); outro caso, 409. Backup do servidor inteiro é recusado (400).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup]
              properties:
                backup: {type: string, format: binary}
      responses:
        "200":
          description: Importado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  imported:
                    type: object
                    properties:
                      visits: {type: integer}
                      photos: {type: integer}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}

  /api/backup:
    get:
      tags: [backup]
      summary: Baixa o backup do servidor (.zip)
      description: |
        Todos os perfis (`profiles/<id>/`), com um `manifest.json` (formato 2).
        Fora: dados do mapa, `setup.json`, lixeira. Feito com o app no ar.
      responses:
        "200": {description: O arquivo., content: {application/zip: {}}}

  /api/backup/info:
    get:
      tags: [backup]
      summary: O que entraria no backup
      responses:
        "200":
          description: Perfis, totais, tamanho e quando foi baixado o último.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles: {type: array, items: {type: string}, description: Nomes.}
                  visits: {type: integer}
                  photos: {type: integer}
                  landmarks: {type: integer}
                  bytes: {type: integer}
                  last_backup: {type: [string, "null"], format: date-time}

  /api/restore:
    post:
      tags: [backup]
      summary: Restaura o servidor a partir de um backup
      description: |
        **Troca todos os perfis** pelos do .zip, depois de guardar o estado
        atual em `data/backups/`. Um perfil exportado (ou um backup de antes
        dos perfis) vira o único perfil.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup]
              properties:
                backup: {type: string, format: binary}
      responses:
        "200":
          description: Restaurado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  restored:
                    type: object
                    properties:
                      profiles: {type: integer}
                      visits: {type: integer}
                      photos: {type: integer}
                  safety: {type: string, description: Nome da cópia do estado anterior.}
        "400": {$ref: "#/components/responses/Error"}

  /api/setup:
    get:
      tags: [instalação]
      summary: Estado da instalação e da montagem dos dados do mapa
      responses:
        "200":
          description: Estado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  done: {type: boolean, description: Assistente concluído.}
                  mode: {type: [string, "null"], enum: [leve, completo, null]}
                  running: {type: boolean, description: Montagem rodando.}
                  ready: {type: boolean, description: Dados do mapa prontos.}
                  installed: {type: boolean}
                  simulate: {type: boolean}
                  build:
                    type: object
                    description: Andamento (etapas, `step`, `done`, `msg`, `state`, `error`, `started_at`, `finished_at`).
                  counts:
                    type: object
                    properties:
                      visits: {type: integer}
                      photos: {type: integer}
                      landmarks: {type: integer}

  /api/setup/start:
    post:
      tags: [instalação]
      summary: Conclui o assistente e começa a montagem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [leve, completo]}
      responses:
        "200": {description: Mesmo formato de `GET /api/setup`.}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    perfil:
      type: apiKey
      in: cookie
      name: perfil
      description: |
        Não é autenticação: só escolhe o perfil (id numérico). Opcional com um
        perfil só.

  responses:
    Ok:
      description: Feito.
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: {type: boolean, const: true}
    Error:
      description: Erro, com a mensagem numa página HTML curta.
      content:
        text/html:
          schema: {type: string}
    NoProfile:
      description: Vários perfis e nenhum escolhido (mande o cookie `perfil`).
      content:
        text/html:
          schema: {type: string}

  schemas:
    Kind:
      type: string
      enum: [country, state, city, airport, landmark]
    VisitKind:
      type: string
      enum: [country, state, city, airport]
    PlaceRef:
      type: object
      properties:
        kind: {$ref: "#/components/schemas/Kind"}
        id: {type: [string, integer]}
        name: {type: string}
    VisitFlags:
      type: object
      properties:
        visited: {type: boolean, description: Conta como visitado (direto ou implícito).}
        explicit: {type: boolean, description: Foi marcado diretamente.}
    VisitedBase:
      type: object
      properties:
        id: {type: [string, integer]}
        name: {type: string}
        kind: {$ref: "#/components/schemas/Kind"}
        explicit: {type: boolean}
        photos: {type: integer}
    VisitedCountry:
      $ref: "#/components/schemas/VisitedBase"
    VisitedState:
      allOf:
        - $ref: "#/components/schemas/VisitedBase"
        - type: object
          properties:
            country_id: {type: string}
            country: {type: string}
    VisitedCity:
      allOf:
        - $ref: "#/components/schemas/VisitedBase"
        - type: object
          properties:
            region: {type: string, description: Estado segundo o GeoNames (reserva quando não há state).}
            lat: {type: number}
            lon: {type: number}
            state_id: {type: [string, "null"]}
            state: {type: [string, "null"]}
            country_id: {type: string}
            country: {type: string}
            has_shape: {type: [integer, "null"], description: 1 se o contorno já foi calculado.}
    VisitedAirport:
      allOf:
        - $ref: "#/components/schemas/VisitedBase"
        - type: object
          properties:
            municipality: {type: string}
            lat: {type: number}
            lon: {type: number}
            country_id: {type: string}
            country: {type: string}
    VisitedLandmark:
      allOf:
        - $ref: "#/components/schemas/VisitedBase"
        - type: object
          properties:
            lat: {type: number}
            lon: {type: number}
            city: {type: [string, "null"]}
            country: {type: [string, "null"]}
            cover: {type: [string, "null"], description: "Nome base da foto de capa (/photos/thumb/<cover>.jpg)."}
    SearchResult:
      allOf:
        - $ref: "#/components/schemas/PlaceRef"
        - $ref: "#/components/schemas/VisitFlags"
        - type: object
          properties:
            sub: {type: [string, "null"], description: '"Estado, País" ou "Cidade, País".'}
    FlagPlace:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        visited: {type: boolean}
        flag: {type: [string, "null"], description: URL da bandeira (sem bandeira, null).}
    Photo:
      type: object
      properties:
        id: {type: integer}
        taken_on: {type: [string, "null"], format: date}
        width: {type: integer}
        height: {type: integer}
        url: {type: string, description: Versão de exibição (2000 px).}
        thumb: {type: string, description: Miniatura (600 px).}
        kind: {$ref: "#/components/schemas/Kind"}
        ref_id: {type: string, description: Lugar dono da foto.}
    IndexedPhoto:
      allOf:
        - $ref: "#/components/schemas/Photo"
        - type: object
          properties:
            label: {type: string, description: Nome do lugar dono.}
            city:
              oneOf: [{$ref: "#/components/schemas/PlaceRef"}, {type: "null"}]
            state:
              oneOf: [{$ref: "#/components/schemas/PlaceRef"}, {type: "null"}]
            country:
              oneOf: [{$ref: "#/components/schemas/PlaceRef"}, {type: "null"}]
    PhotoGroup:
      type: object
      properties:
        title: {type: string}
        place: {$ref: "#/components/schemas/PlaceRef"}
        photos:
          type: array
          items: {$ref: "#/components/schemas/IndexedPhoto"}
    Place:
      type: object
      description: Os campos do lugar variam por tipo (cidade e aeroporto têm lat/lon; estado e país, bbox).
      properties:
        kind: {$ref: "#/components/schemas/Kind"}
        id: {type: [string, integer]}
        name: {type: string}
        lat: {type: number}
        lon: {type: number}
        bbox:
          type: array
          items: {type: number}
          description: "[oeste, sul, leste, norte]"
        crumbs:
          type: array
          items: {$ref: "#/components/schemas/PlaceRef"}
          description: Hierarquia (cidade → estado → país).
        explicit: {type: boolean}
        visited: {type: boolean}
        via:
          type: array
          items: {$ref: "#/components/schemas/PlaceRef"}
          description: As visitas explícitas que tornam o lugar visitado.
        photos:
          type: array
          items: {$ref: "#/components/schemas/IndexedPhoto"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/PhotoGroup"}
        dates:
          type: array
          items: {$ref: "#/components/schemas/Month"}
          description: Datas de visita do próprio lugar, da mais antiga à mais recente.
        inherited:
          type: array
          description: Datas do que está dentro do lugar (cidades de um estado, monumentos de uma cidade…), por mês.
          items:
            type: object
            properties:
              month: {$ref: "#/components/schemas/Month"}
              places: {type: array, items: {$ref: "#/components/schemas/PlaceRef"}}
        suggested:
          type: array
          items: {$ref: "#/components/schemas/Month"}
          description: Meses das fotos do lugar que ainda não têm visita (sugestão; nada é gravado).
    Month:
      type: string
      pattern: "^\\d{4}(-(0[1-9]|1[0-2]))?(/\\d{4}(-(0[1-9]|1[0-2]))?)?$"
      example: "2024-03"
      description: |
        Data de visita: ano e mês (AAAA-MM), só o ano (AAAA) ou um período
        início/fim, como um intervalo da ISO 8601 (`2010/2018`,
        `2010-03/2018-06`), para lugar onde morou. O fim vem depois do início.
    SaveResult:
      type: object
      properties:
        saved: {type: array, items: {type: integer}}
        errors: {type: array, items: {type: string}}
    Prefs:
      type: object
      properties:
        theme: {type: string, enum: [light, dark, auto]}
        colors: {type: object, additionalProperties: {type: string}}
        name: {type: string}
        photo: {type: [string, "null"], description: Versão da foto de perfil.}
        projection: {type: string, enum: [mercator, globe]}
        external: {type: object, additionalProperties: {type: boolean}}
        borders: {type: object, additionalProperties: {type: boolean}}
        skip_animations: {type: boolean}
